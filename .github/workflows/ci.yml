name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SortAlgorithms.sln

      - name: Build
        run: dotnet build SortAlgorithms.sln -c Release --no-restore

      - name: Test
        run: dotnet test SortAlgorithms.Tests -c Release --no-build --verbosity normal
